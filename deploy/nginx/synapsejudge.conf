# SynapseJudge — Nginx reverse proxy.
#
# Install:
#   sudo cp deploy/nginx/synapsejudge.conf /etc/nginx/sites-available/synapsejudge
#   sudo ln -sf /etc/nginx/sites-available/synapsejudge /etc/nginx/sites-enabled/synapsejudge
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate. Run certbot AFTER this file is in place and the
# plain-HTTP server below is reachable — it edits this file to add the TLS
# listener and the HTTP->HTTPS redirect for you:
#
#   sudo certbot --nginx -d synapsejudge.duckdns.org
#
# Do not hand-write the ssl_certificate lines; certbot manages them and will
# refuse to touch a file whose directives it did not create.

upstream synapsejudge_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Submissions are the expensive path. The API rate-limits per user as well, but
# doing it here keeps a flood from ever reaching Node.
limit_req_zone $binary_remote_addr zone=synapsejudge_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=synapsejudge_submit:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name synapsejudge.duckdns.org;

    # Absolute path to the Vite build output.
    root /home/ubuntu/synapseJudge/client/dist;
    index index.html;

    access_log /var/log/nginx/synapsejudge.access.log;
    error_log  /var/log/nginx/synapsejudge.error.log;

    # A 100 KB source limit plus JSON overhead — anything larger is not a
    # submission, so reject it at the edge instead of buffering it into Node.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------- API ---------------------------------- #

    location /api/ {
        limit_req zone=synapsejudge_api burst=40 nodelay;

        proxy_pass http://synapsejudge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # express `trust proxy` reads this to rate-limit the real client, not us.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Judging is queued and polled, so no request should ever be long-lived;
        # a 60s ceiling stops a stuck upstream from pinning worker connections.
        proxy_read_timeout    60s;
    }

    location = /api/submissions {
        limit_req zone=synapsejudge_submit burst=10 nodelay;

        proxy_pass http://synapsejudge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------- static SPA ------------------------------ #

    # Vite emits content-hashed filenames, so assets can be cached immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on the old
    # bundle while the API has already moved on.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
